name: APK qurish
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Gradle wrapper yaratish
        run: gradle wrapper --gradle-version 8.7
      - name: Debug APK qurish
        run: ./gradlew assembleDebug --stacktrace
      - name: APK ni Release ga yuklash
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-build${{ github.run_number }}
          name: Azura Relay v1.0-build${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
